name: Desktop installer previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/provider-adapters/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-installer.yml"

permissions:
  contents: read

jobs:
  installer:
    name: Build ${{ matrix.label }} unsigned installer preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            script: dist:win
          - os: macos-latest
            label: macOS
            script: dist:mac
          - os: ubuntu-latest
            label: Linux
            script: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm --filter @battlebuket/desktop ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: battlebuket-codes-${{ matrix.label }}-unsigned-preview
          path: apps/desktop/release/
          if-no-files-found: error
          retention-days: 14
