name: Desktop installer preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @battlebuket/desktop dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: battlebuket-codes-windows-unsigned-preview
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
