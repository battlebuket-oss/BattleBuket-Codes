name: Windows AppContainer command sandbox

on:
  push:
    branches:
      - feature/windows-appcontainer-broker
    paths:
      - "apps/desktop/windows/AppContainerBroker/**"
      - "apps/desktop/src/main/command-sandbox.ts"
      - "apps/desktop/src/main/project-verification.ts"
      - "apps/desktop/test/command-sandbox.test.ts"
      - "apps/desktop/test/project-verification.test.ts"
      - "apps/desktop/scripts/build-windows-appcontainer-broker.cjs"
      - "apps/desktop/package.json"
      - ".github/workflows/windows-appcontainer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-appcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Build and adversarially test Windows AppContainer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Configure pinned package manager
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies for high-severity advisories
        run: pnpm audit --audit-level high
      - name: Build AppContainer broker as a self-contained executable
        run: pnpm --filter @battlebuket/desktop build:windows-broker
      - name: Verify broker artifact
        shell: pwsh
        run: |
          $broker = "apps/desktop/resources/windows/publish/BattleBuket.AppContainerBroker.exe"
          if (-not (Test-Path $broker)) { throw "AppContainer broker executable was not produced." }
          $info = Get-Item $broker
          if ($info.Length -lt 50000) { throw "AppContainer broker executable is unexpectedly small." }
          $probe = Start-Process -FilePath $broker -Wait -PassThru -NoNewWindow
          if ($probe.ExitCode -ne 125) { throw "Broker did not reject invalid invocation closed (exit=$($probe.ExitCode))." }
      - name: Prepare persistent AppContainer profile before parallel test workers
        shell: pwsh
        run: |
          Write-Host "Profile context: USERPROFILE=$env:USERPROFILE LOCALAPPDATA=$env:LOCALAPPDATA"
          $broker = "apps/desktop/resources/windows/publish/BattleBuket.AppContainerBroker.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "battlebuket-appcontainer-prepare.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "battlebuket-appcontainer-prepare.stderr.log"
          $prepare = Start-Process -FilePath $broker -ArgumentList @("--prepare") -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($prepare.ExitCode -ne 0) {
            if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
            throw "AppContainer profile preparation failed with exit code $($prepare.ExitCode)."
          }
          $sandboxRoot = (Get-Content $stdout -Raw).Trim()
          $packagesRoot = Join-Path $env:LOCALAPPDATA "Packages"
          $expectedPrefix = [IO.Path]::GetFullPath($packagesRoot).TrimEnd('\') + '\'
          $fullSandboxRoot = [IO.Path]::GetFullPath($sandboxRoot)
          if (-not $fullSandboxRoot.StartsWith($expectedPrefix, [StringComparison]::OrdinalIgnoreCase) -or
              $fullSandboxRoot -notmatch '\\AC\\Temp\\BattleBuketCodes_[0-9a-f]{32}$') {
            throw "AppContainer broker returned a sandbox path outside the expected Packages/<profile>/AC/Temp location: $fullSandboxRoot"
          }
          Write-Host "AppContainer profile initialized and returned an isolated AC\Temp path."
          Remove-Item -LiteralPath $fullSandboxRoot -Recurse -Force
      - name: Verify AppContainer child process and output pipe
        shell: pwsh
        run: |
          $broker = "apps/desktop/resources/windows/publish/BattleBuket.AppContainerBroker.exe"
          $prepareOut = Join-Path $env:RUNNER_TEMP "battlebuket-appcontainer-child-prepare.log"
          $prepare = Start-Process -FilePath $broker -ArgumentList @("--prepare") -Wait -PassThru -NoNewWindow -RedirectStandardOutput $prepareOut
          if ($prepare.ExitCode -ne 0) { throw "Could not prepare AppContainer storage for the child-process probe." }
          $sandboxRoot = (Get-Content $prepareOut -Raw).Trim()
          $workspace = Join-Path $sandboxRoot "workspace"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          $requestPath = Join-Path $env:RUNNER_TEMP "battlebuket-appcontainer-child-request.json"
          $request = @{
            workspace = $workspace
            scratch = $sandboxRoot
            executable = (Join-Path $env:SystemRoot "System32\cmd.exe")
            args = @("/d", "/c", "echo BATTLEBUKET_APP_CONTAINER_CHILD_OK")
            environment = @{
              PATH = (Join-Path $env:SystemRoot "System32")
              SystemRoot = $env:SystemRoot
              TEMP = $sandboxRoot
              TMP = $sandboxRoot
              USERPROFILE = $sandboxRoot
              PATHEXT = ".COM;.EXE;.BAT;.CMD"
            }
          }
          $request | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $requestPath -Encoding utf8
          $stdout = Join-Path $env:RUNNER_TEMP "battlebuket-appcontainer-child.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "battlebuket-appcontainer-child.stderr.log"
          $child = Start-Process -FilePath $broker -ArgumentList @("--request", $requestPath) -Wait:$false -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $child.WaitForExit(30000)) {
            $child.Kill($true)
            throw "AppContainer child-process probe exceeded 30 seconds."
          }
          if ($child.ExitCode -ne 0) {
            if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
            throw "AppContainer child-process probe failed with exit code $($child.ExitCode)."
          }
          if (-not (Get-Content $stdout -Raw).Contains("BATTLEBUKET_APP_CONTAINER_CHILD_OK")) {
            if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
            throw "AppContainer child process did not return its output marker."
          }
          Remove-Item -LiteralPath $sandboxRoot -Recurse -Force
      - name: Verify Node runtime inside AppContainer
        shell: pwsh
        run: |
          $broker = "apps/desktop/resources/windows/publish/BattleBuket.AppContainerBroker.exe"
          $nodeExe = (Get-Command node.exe).Source
          $nodeDirectory = Split-Path -Parent $nodeExe
          $prepareOut = Join-Path $env:RUNNER_TEMP "battlebuket-appcontainer-node-prepare.log"
          $prepare = Start-Process -FilePath $broker -ArgumentList @("--prepare") -Wait -PassThru -NoNewWindow -RedirectStandardOutput $prepareOut
          if ($prepare.ExitCode -ne 0) { throw "Could not prepare AppContainer storage for the Node runtime probe." }
          $sandboxRoot = (Get-Content $prepareOut -Raw).Trim()
          $workspace = Join-Path $sandboxRoot "workspace"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          $requestPath = Join-Path $env:RUNNER_TEMP "battlebuket-appcontainer-node-request.json"
          $system32 = Join-Path $env:SystemRoot "System32"
          $environment = @{
            PATH = ($nodeDirectory + ";" + $system32)
            SystemRoot = $env:SystemRoot
            TEMP = $sandboxRoot
            TMP = $sandboxRoot
            USERPROFILE = $sandboxRoot
            APPDATA = $sandboxRoot
            LOCALAPPDATA = $sandboxRoot
            PATHEXT = ".COM;.EXE;.BAT;.CMD"
          }
          function Invoke-AppContainerNodeProbe([string[]]$Arguments, [string]$Name, [int]$TimeoutMs) {
            $requestPath = Join-Path $env:RUNNER_TEMP ("battlebuket-appcontainer-node-" + $Name + ".json")
            $request = @{
              workspace = $workspace
              scratch = $sandboxRoot
              executable = $nodeExe
              args = $Arguments
              environment = $environment
            }
            $request | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $requestPath -Encoding utf8
            $stdout = Join-Path $env:RUNNER_TEMP ("battlebuket-appcontainer-node-" + $Name + ".stdout.log")
            $stderr = Join-Path $env:RUNNER_TEMP ("battlebuket-appcontainer-node-" + $Name + ".stderr.log")
            $child = Start-Process -FilePath $broker -ArgumentList @("--request", $requestPath) -Wait:$false -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $child.WaitForExit($TimeoutMs)) {
              Write-Host "===== $Name stdout before timeout ====="
              if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
              Write-Host "===== $Name stderr before timeout ====="
              if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
              $child.Kill($true)
              throw "AppContainer Node probe '$Name' exceeded $TimeoutMs ms."
            }
            if ($child.ExitCode -ne 0) {
              if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
              if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
              throw "AppContainer Node probe '$Name' failed with exit code $($child.ExitCode)."
            }
            return (Get-Content $stdout -Raw)
          }
          $version = Invoke-AppContainerNodeProbe @("--version") "version" 10000
          Write-Host "AppContainer Node version: $version"
          $marker = Invoke-AppContainerNodeProbe @("-e", "console.log('BATTLEBUKET_APP_CONTAINER_NODE_OK'); process.exit(0)") "script" 10000
          if (-not $marker.Contains("BATTLEBUKET_APP_CONTAINER_NODE_OK")) {
            throw "Node did not return its AppContainer script marker. Output: $marker"
          }
          Remove-Item -LiteralPath $sandboxRoot -Recurse -Force
      - name: Typecheck and lint
        run: |
          pnpm lint
          pnpm typecheck
      - name: Run unit and OS-enforced boundary tests
        run: pnpm test
      - name: Rebuild native dependencies for Electron
        run: pnpm --filter @battlebuket/desktop exec electron-builder install-app-deps
      - name: Verify node-pty in the Electron runtime
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: pnpm --filter @battlebuket/desktop exec electron scripts/pty-smoke.cjs
      - name: Build packaged desktop application
        run: pnpm --filter @battlebuket/desktop build
      - name: Package unsigned application for installed-runtime smoke
        run: pnpm --filter @battlebuket/desktop exec electron-builder --dir --config electron-builder.smoke.config.cjs --publish never
      - name: Launch packaged workbench and terminal smoke
        shell: pwsh
        run: |
          $application = Get-ChildItem "apps/desktop/release-smoke" -Recurse -Filter "battlebuket-codes.exe" | Select-Object -First 1
          if (-not $application) { throw "Packaged Windows application executable was not produced." }
          $stdout = Join-Path $env:RUNNER_TEMP "battlebuket-packaged-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "battlebuket-packaged-smoke.stderr.log"
          $smoke = Start-Process -FilePath $application.FullName -ArgumentList @("--smoke-test", "--enable-logging=stderr") -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($smoke.ExitCode -ne 0) {
            if (Test-Path $stdout) { Get-Content $stdout -Tail 250 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 500 }
            throw "Packaged Windows workbench/PTY smoke failed with exit code $($smoke.ExitCode)."
          }
          if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
      - uses: actions/upload-artifact@v4
        with:
          name: battlebuket-windows-appcontainer-smoke
          path: |
            apps/desktop/resources/windows/publish/BattleBuket.AppContainerBroker.exe
            apps/desktop/release-smoke/**
          if-no-files-found: error
          retention-days: 14
