name: Signed desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source before release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux sandbox and desktop smoke prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap dbus-daemon xvfb
      - name: Configure pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Prepare release SBOM directory
        run: mkdir -p release-sbom
      - name: Generate SPDX release SBOM with pinned Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ./node_modules/.pnpm
          format: spdx-json
          output-file: release-sbom/battlebuket-codes.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - name: Generate release dependency license inventory
        run: node scripts/build-license-inventory.mjs release-sbom/battlebuket-codes.spdx.json release-sbom/LICENSE-INVENTORY.csv release-sbom/LICENSE-INVENTORY-SUMMARY.md
      - name: Attest release SBOM and license inventory
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-sbom/*
      - uses: actions/upload-artifact@v4
        with:
          name: BattleBuket-Codes-SBOM
          path: release-sbom/*
          if-no-files-found: error
          retention-days: 90
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify desktop package version matches the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          actual="$(node -p "require('./apps/desktop/package.json').version")"
          test "$actual" = "$expected" || { echo "Desktop package version $actual does not match release tag $RELEASE_TAG."; exit 1; }
      - run: pnpm build

  build:
    needs: validate
    name: Build and sign ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            script: dist:win
          - os: macos-latest
            label: macOS
            script: dist:mac
          - os: ubuntu-latest
            label: Linux
            script: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw "Configure WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD before creating a production release." }
      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo "Configure MACOS_CSC_LINK, MACOS_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID before creating a production release."; exit 1; }
      - name: Configure package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build signed installer
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || runner.os == 'macOS' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @battlebuket/desktop ${{ matrix.script }}
      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem "apps/desktop/release" -Filter "*.exe"
          if (-not $files) { throw "No Windows installer was produced." }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") { throw "Installer signature is not valid: $($file.Name) ($($signature.Status))" }
          }
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg="$(find apps/desktop/release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          xcrun stapler validate "$dmg"
          mkdir -p /tmp/battlebuket-dmg
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/battlebuket-dmg
          app="$(find /tmp/battlebuket-dmg -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          hdiutil detach /tmp/battlebuket-dmg
      - name: Generate Linux installer checksum
        if: runner.os == 'Linux'
        run: |
          cd apps/desktop/release
          sha256sum *.AppImage > SHA256SUMS
      - name: Install, launch and uninstall Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/release" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found." }
          $installDir = Join-Path $env:RUNNER_TEMP "BattleBuketInstallSmoke"
          Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait
          $application = Join-Path $installDir "battlebuket-codes.exe"
          if (-not (Test-Path $application)) { throw "Installed application executable was not found." }
          $stdout = Join-Path $env:RUNNER_TEMP "battlebuket-installed-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "battlebuket-installed-smoke.stderr.log"
          $smoke = Start-Process -FilePath $application -ArgumentList @("--smoke-test", "--enable-logging=stderr") -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($smoke.ExitCode -ne 0) {
            if (Test-Path $stdout) { Get-Content $stdout -Tail 250 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 500 }
            throw "Installed application smoke test failed with exit code $($smoke.ExitCode)."
          }
          $uninstaller = Join-Path $installDir "Uninstall BattleBuket Codes.exe"
          if (-not (Test-Path $uninstaller)) { throw "NSIS uninstaller was not found." }
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          if (Test-Path $application) { throw "Application executable remains after silent uninstall." }
      - name: Install, launch and uninstall macOS app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg="$(find apps/desktop/release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mkdir -p /tmp/battlebuket-install-smoke
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/battlebuket-install-smoke
          source_app="$(find /tmp/battlebuket-install-smoke -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$source_app"
          installed_app="$RUNNER_TEMP/BattleBuket Codes.app"
          ditto "$source_app" "$installed_app"
          hdiutil detach /tmp/battlebuket-install-smoke
          stdout="$RUNNER_TEMP/battlebuket-macos-smoke.stdout.log"
          stderr="$RUNNER_TEMP/battlebuket-macos-smoke.stderr.log"
          set +e
          "$installed_app/Contents/MacOS/battlebuket-codes" --smoke-test >"$stdout" 2>"$stderr"
          smoke_status=$?
          set -e
          if [[ "$smoke_status" -ne 0 ]]; then
            cat "$stdout"
            cat "$stderr"
            exit "$smoke_status"
          fi
          rm -rf "$installed_app"
          test ! -e "$installed_app"
      - name: Launch Linux AppImage with Chromium sandbox enabled
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          appimage="$(find apps/desktop/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          smoke_appimage="$RUNNER_TEMP/$(basename "$appimage")"
          cp "$appimage" "$smoke_appimage"
          chmod +x "$smoke_appimage"
          bash apps/desktop/scripts/run-appimage-smoke.sh "$smoke_appimage" --smoke-test
          rm -f "$smoke_appimage"
          test -e "$appimage"
      - uses: actions/upload-artifact@v4
        with:
          name: BattleBuket-Codes-${{ matrix.label }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    name: Assemble draft GitHub release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft release with signed installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* --draft --verify-tag --title "BattleBuket Codes $TAG" --notes "Signed desktop installers. Verify platform-specific installation and runtime behavior before publishing this release."
