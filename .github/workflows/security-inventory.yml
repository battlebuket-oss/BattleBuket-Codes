name: SBOM and license inventory

on:
  push:
    branches: [main, feature/pty-terminal]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SPDX SBOM and license review inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Prepare SBOM output directory
        run: mkdir -p artifacts
      - name: Generate SPDX SBOM with pinned Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: artifacts/battlebuket-codes.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
      - name: Build package/license inventory and manual-review summary
        run: node scripts/build-license-inventory.mjs artifacts/battlebuket-codes.spdx.json artifacts/LICENSE-INVENTORY.csv artifacts/LICENSE-INVENTORY-SUMMARY.md
      - name: Publish SBOM and license inventory as CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: battlebuket-codes-sbom-and-license-inventory
          path: |
            artifacts/battlebuket-codes.spdx.json
            artifacts/LICENSE-INVENTORY.csv
            artifacts/LICENSE-INVENTORY-SUMMARY.md
          if-no-files-found: error
          retention-days: 90
      - name: Add inventory summary to workflow report
        if: always()
        run: |
          if [ -f artifacts/LICENSE-INVENTORY-SUMMARY.md ]; then
            cat artifacts/LICENSE-INVENTORY-SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
