name: Authenticated provider smoke tests

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Providers to exercise using the self-hosted runner's local sign-in
        type: choice
        required: true
        default: codex,claude
        options:
          - codex,claude
          - codex
          - claude

permissions:
  contents: read

jobs:
  live-provider-smoke:
    name: Live provider conformance (\${{ inputs.providers }})
    runs-on: [self-hosted, battlebuket-provider-smoke]
    timeout-minutes: 90
    env:
      BATTLEBUKET_REAL_PROVIDER_SMOKE: "1"
      BATTLEBUKET_SMOKE_PROVIDERS: \${{ inputs.providers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify installed and authenticated provider runtimes
        run: pnpm --filter @battlebuket/provider-adapters test
